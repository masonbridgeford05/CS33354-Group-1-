<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CometGrid - Register</title>
    <style>
        :root { --utd-orange: #C45508; --utd-green: #154734; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { color: var(--utd-green); text-align: center; margin-bottom: 0.5rem; }
        p { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        
        /* Message Handling */
        .messages { list-style: none; padding: 0; margin-bottom: 1.5rem; }
        .alert { padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 8px; text-align: center; font-weight: 500; }
        
        /* The "Success" fix: Green for success, Red for errors */
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--utd-orange); outline: none; box-shadow: 0 0 0 3px rgba(196, 85, 8, 0.1); }
        
        .btn { width: 100%; padding: 12px; background: var(--utd-orange); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #a34606; transform: translateY(-1px); }
        
        .footer-text { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #777; }
        .footer-text a { color: var(--utd-green); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Join the Grid</h2>
    <p>Create an account to save your scores</p>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% endif %}">
            {{ message }}
        </li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>UTD Email</label>
            <input type="email" name="userEmail" required placeholder="abc123456@utdallas.edu"
            value="{{ typed_email|default:'' }}">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="userName" required 
            placeholder="Display Name"
            value="{{ typed_name|default:'' }}">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="userPassword" required placeholder="Minimum 12 characters">
            <small style="color: #666; font-size: 0.75rem; display: block; margin-top: 4px;">
                Must be 12 characters or longer.
            </small>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>

    <div class="footer-text">
        Already have an account? <a href="{% url 'login' %}">Sign in here</a>
    </div>
</div>

</body>
</html>
