{% extends "base.html" %}

{% block content %}
<div class="container">
   <div class="card" style="width: 400px;">
       <h1>Previous Scores</h1>
       <table style="width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 30px;">
           <thead>
               <tr style="border-bottom: 2px solid #eee;">
                   <th style="text-align: left; padding: 10px 8px; font-size: 0.9rem; color: #555;">Game</th>
                   <th style="text-align: left; padding: 10px 8px; font-size: 0.9rem; color: #555;">Difficulty</th>
                   <th style="text-align: right; padding: 10px 8px; font-size: 0.9rem; color: #555;">Score</th>
               </tr>
           </thead>
           <tbody>
               {% for result in scores %}
               <tr style="border-bottom: 1px solid #f0f0f0;">
                   <td style="padding: 12px 8px; font-size: 0.95rem;">Game {{ forloop.counter }}</td>
                   <td style="padding: 12px 8px; font-size: 0.95rem;">{{ result.difficulty }}</td>
                   <td style="padding: 12px 8px; font-size: 0.95rem; text-align: right; font-weight: bold;">{{ result.score }}</td>
               </tr>
               {% empty %}
               <tr>
                   <td colspan="3" style="padding: 20px 8px; text-align: center; color: #888;">No games played yet.</td>
               </tr>
               {% endfor %}
           </tbody>
       </table>
       <a href="#" class="btn-start" style="background-color: #ccc; color: #333;">Back to Dashboard</a>
   </div>
</div>
{% endblock %}
