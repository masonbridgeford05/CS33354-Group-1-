{% extends "base.html" %}

{% block content %}
<div class="container">
   <div class="card" style="width: 400px;">
       <h1>Play Game</h1>
       {% if image_path %}
       <img src="{{ image_path }}" alt="Guess this location" style="width: 100%; border-radius: 8px; margin-bottom: 20px;">
       {% else %}
       <div style="width: 100%; height: 180px; background-color: #ccc; border-radius: 8px; margin-bottom: 20px;"></div>
       {% endif %}
       <form method="POST">
           {% csrf_token %}
           <div class="input-group">
               <input type="text" name="guess" class="figma-input" placeholder="Enter your guess" required>
           </div>
           <button type="submit" class="btn-primary">Submit Guess</button>
       </form>
       <div class="footer-links">
           <a href="#">Back to Dashboard</a>
       </div>
   </div>
</div>
{% endblock %}
